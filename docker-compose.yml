version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mkr-frontend
    ports:
      - "80:80"
      # Раскомментируйте для HTTPS (требует сертификата)
      # - "443:443"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Опционально: volume для сертификатов SSL (если используется HTTPS)
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro
    networks:
      - mkr-network

networks:
  mkr-network:
    driver: bridge
